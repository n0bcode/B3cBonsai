services:
  server:
    build:
      context: .
      target: final
    ports:
      - 8080:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UsePostgreSql=true
      - ConnectionStrings__PostgreConnectString=Host=db;Database=B3cBonsai;Username=postgres;Password=postgres
      # Optional: Cloudinary Configuration
      # - UseCloudinaryStorage=false
      # - CloudinarySettings__CloudName=YOUR_CLOUD_NAME
      # - CloudinarySettings__ApiKey=YOUR_API_KEY
      # - CloudinarySettings__ApiSecret=YOUR_API_SECRET
      # Optional: Email Configuration
      # - EmailSettings__Email=smtpmvc555@gmail.com
      # - EmailSettings__Password=YOUR_EMAIL_APP_PASSWORD_HERE
      # - EmailSettings__Host=smtp.gmail.com
      # - EmailSettings__Port=587
      # Optional: Gemini AI Configuration
      # - Gemini__ApiKey=YOUR_GEMINI_API_KEY
      # - Gemini__Model=gemini-1.5-flash
      # Optional: Authentication Providers
      # - Authentication__Google__ClientId=YOUR_GOOGLE_CLIENT_ID
      # - Authentication__Google__ClientSecret=YOUR_GOOGLE_CLIENT_SECRET
      # - Authentication__Facebook__ClientId=YOUR_FACEBOOK_CLIENT_ID
      # - Authentication__Facebook__ClientSecret=YOUR_FACEBOOK_CLIENT_SECRET
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=B3cBonsai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
